apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: praxis
spec:
  type: ClusterIP
  selector:
    app: ledger
  ports:
    - name: grpc
      port: 9091
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: matching
  namespace: praxis
spec:
  type: ClusterIP
  selector:
    app: matching
  ports:
    - name: grpc
      port: 9092
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: praxis
spec:
  type: NodePort
  selector:
    app: order
  ports:
    - name: http
      port: 8083
      targetPort: http
      nodePort: 30083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: praxis
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
      annotations:
        checksum/runtime: ${RUNTIME_CONFIG_HASH}
    spec:
      serviceAccountName: ledger
      nodeSelector:
        praxis.io/workload: hot-path
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger
          image: ${LEDGER_IMAGE}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: grpc
              containerPort: 9091
            - name: http
              containerPort: 8081
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: AWS_REGION}
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: OTEL_EXPORTER_OTLP_ENDPOINT}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACE_SAMPLE_RATIO
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: OTEL_TRACE_SAMPLE_RATIO}
            - name: OTEL_RESOURCE_ATTRIBUTES
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: OTEL_RESOURCE_ATTRIBUTES}
            - name: KAFKA_AUTH_MODE
              value: msk_iam
            - name: LEDGER_HTTP_ADDRESS
              value: ":8081"
            - name: LEDGER_GRPC_ADDRESS
              value: ":9091"
            - name: LEDGER_DB_HOST
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: LEDGER_DB_HOST}
            - name: LEDGER_DB_USER
              value: ledger_runtime
            - name: LEDGER_DB_NAME
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: LEDGER_DB_NAME}
            - name: LEDGER_DB_SECRET_ARN
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: LEDGER_DB_SECRET_ARN}
            - name: LEDGER_MIGRATE_ON_STARTUP
              value: "false"
            - name: LEDGER_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: MSK_BROKERS}
            - name: LEDGER_COMMANDS_TOPIC
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: LEDGER_COMMANDS_TOPIC}
            - name: LEDGER_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: LEDGER_CONSUMER_GROUP}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching
  namespace: praxis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matching
  template:
    metadata:
      labels:
        app: matching
      annotations:
        checksum/runtime: ${RUNTIME_CONFIG_HASH}
    spec:
      serviceAccountName: matching
      nodeSelector:
        praxis.io/workload: hot-path
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matching
          image: ${MATCHING_IMAGE}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: grpc
              containerPort: 9092
            - name: http
              containerPort: 8084
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: AWS_REGION}
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: OTEL_EXPORTER_OTLP_ENDPOINT}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACE_SAMPLE_RATIO
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: OTEL_TRACE_SAMPLE_RATIO}
            - name: OTEL_RESOURCE_ATTRIBUTES
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: OTEL_RESOURCE_ATTRIBUTES}
            - name: KAFKA_AUTH_MODE
              value: msk_iam
            - name: MATCHING_GRPC_ADDRESS
              value: ":9092"
            - name: MATCHING_HTTP_ADDRESS
              value: ":8084"
            - name: MATCHING_KAFKA_ENABLED
              value: "true"
            - name: MATCHING_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: MSK_BROKERS}
            - name: MATCHING_KAFKA_TOPIC
              valueFrom:
                configMapKeyRef: {name: praxis-runtime, key: MATCHING_EVENTS_TOPIC}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
---
