apiVersion: batch/v1
kind: Job
metadata:
  name: ${LEDGER_MIGRATION_NAME}
  namespace: praxis
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: ledger-migration
      nodeSelector:
        praxis.io/workload: hot-path
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-migration
          image: ${LEDGER_MIGRATION_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: AWS_REGION
              value: ${AWS_REGION}
            - name: LEDGER_DB_HOST
              value: ${LEDGER_DB_HOST}
            - name: LEDGER_DB_USER
              value: ${LEDGER_DB_USER}
            - name: LEDGER_DB_NAME
              value: ${LEDGER_DB_NAME}
            - name: LEDGER_DB_SECRET_ARN
              value: ${LEDGER_DB_SECRET_ARN}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
