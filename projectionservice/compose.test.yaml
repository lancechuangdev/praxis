services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phase6
    ports: ["127.0.0.1:18765:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phase6"]
      interval: 2s
      timeout: 2s
      retries: 30
  mongo:
    image: mongo:7.0.24
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018", "--wiredTigerCacheSizeGB", "0.25"]
    ports: ["127.0.0.1:27018:27018"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --port
        - "27018"
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27018'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 2s
      timeout: 5s
      retries: 30
