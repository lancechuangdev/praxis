services:
  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_DB: cex_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d cex_ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    ports: ["9093:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 96

  ledger-service:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
    environment:
      LEDGER_DATABASE_URL: postgres://ledger:ledger@postgres:5432/cex_ledger?sslmode=disable
      LEDGER_KAFKA_BROKERS: kafka:9092
      LEDGER_HTTP_ADDRESS: :8081
      LEDGER_GRPC_ADDRESS: :9091
    ports: ["8081:8081", "9091:9091"]

  order-service:
    build: ../orderservice
    depends_on:
      ledger-service: {condition: service_started}
      matching-engine: {condition: service_started}
    environment:
      ORDER_HTTP_ADDRESS: :8083
      ORDER_LEDGER_MODE: grpc
      ORDER_LEDGER_GRPC_ADDRESS: ledger-service:9091
      ORDER_MATCHING_MODE: grpc
      ORDER_MATCHING_GRPC_ADDRESS: matching-engine:9092
      ORDER_RISK_LATENCY: 1ms
    ports: ["8083:8083"]

  matching-engine:
    build: ../matchingengine
    depends_on:
      kafka: {condition: service_started}
    environment:
      MATCHING_GRPC_ADDRESS: :9092
      MATCHING_HTTP_ADDRESS: :8084
      MATCHING_ENGINE_LATENCY: 1ms
      MATCHING_KAFKA_ENABLED: "true"
      MATCHING_KAFKA_BROKERS: kafka:9092
      MATCHING_KAFKA_TOPIC: matching.events.v1
    ports: ["8084:8084", "9094:9092"]
