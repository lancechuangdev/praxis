services:
  postgres:
    image: postgres:18.0
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: cex_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d cex_ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    ports: ["9093:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 96
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka: {condition: service_healthy}
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ledger-commands --partitions 96 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ledger-events --partitions 96 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic matching.events.v1 --partitions 96 --replication-factor 1

  ledger-service:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      LEDGER_DATABASE_URL: postgres://ledger:ledger@postgres:5432/cex_ledger?sslmode=disable
      LEDGER_DB_MAX_CONNS: ${LEDGER_DB_MAX_CONNS:-32}
      LEDGER_DB_QUERY_EXEC_MODE: ${LEDGER_DB_QUERY_EXEC_MODE:-cache_statement}
      LEDGER_DB_STATEMENT_CACHE_CAPACITY: ${LEDGER_DB_STATEMENT_CACHE_CAPACITY:-128}
      LEDGER_KAFKA_BROKERS: kafka:9092
      LEDGER_HTTP_ADDRESS: :8081
      LEDGER_GRPC_ADDRESS: :9091
    ports: ["8081:8081", "9091:9091"]

  order-service:
    build: ../orderservice
    depends_on:
      ledger-service: {condition: service_started}
      matching-engine: {condition: service_started}
    environment:
      ORDER_HTTP_ADDRESS: :8083
      ORDER_LEDGER_MODE: grpc
      ORDER_LEDGER_GRPC_ADDRESS: ledger-service:9091
      ORDER_MATCHING_MODE: grpc
      ORDER_MATCHING_GRPC_ADDRESS: matching-engine:9092
      ORDER_RISK_LATENCY: 1ms
    ports: ["8083:8083"]

  matching-engine:
    build: ../matchingengine
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      MATCHING_GRPC_ADDRESS: :9092
      MATCHING_HTTP_ADDRESS: :8084
      MATCHING_ENGINE_LATENCY: 1ms
      MATCHING_KAFKA_ENABLED: "true"
      MATCHING_KAFKA_BROKERS: kafka:9092
      MATCHING_KAFKA_TOPIC: matching.events.v1
    ports: ["8084:8084", "9094:9092"]

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      ledger-service: {condition: service_started}
      order-service: {condition: service_started}
      matching-engine: {condition: service_started}
      cadvisor: {condition: service_started}
      node-exporter: {condition: service_started}

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on:
      prometheus: {condition: service_started}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: ["observability"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:v1.10.2
    profiles: ["observability"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

volumes:
  prometheus-data:
  grafana-data:
